<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">   
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="d-flex align-items-start">
    <img src="assets/image/imagem_usuario.png" alt="imagem usuário" id="imagemUsuario">
    <h2>Adicionar administrador\Usuário</h2>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 
    <p>Dados do Administrador\Usuário</p>
    <p>Preencha as informações abaixo para cadastrar um novo usuário ou administrador</p>

       <div class="row mb-3">
           <div class="col-md-6">
                <label for="Nome">Nome Completo</label>
                <input type="text" id="nome completo" placeholder="Digite o nome completo" >
                <div id="erroNome" class="erro"></div>
            </div>

            <div class="col-md-6">
                <label for="E-mail">E-mail</label>
                <input type="text" id="E-mail" placeholder="Digite o e-mail" >
                <div id="erroe-email" class="erro"></div>
            </div>
            </div>
              
            <div class="row mb-3">
           <div class="col-md-6">
                <label for="Senha">Senha</label>
                <input type="text" id="senha" placeholder="Digite a senha" >
                <div id="erroSenha" class="erro"></div>
            </div>

            <div class="col-md-6">
                <label for="Confirmar senha"> Confirmar Senha</label>
                <input type="text" id="Senha" placeholder="Digite a senha " >
                <div id="erroSenha" class="erro"></div>
            </div>
            </div>
   
           <div class="campo">
                <label>Status</label>
                <select id="bloodType">
                    <option value="">Escolha</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                </select>
            </div>

            
        
</body>
</html>
