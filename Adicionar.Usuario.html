<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">   
    <title>Adicionar Usuário</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="sidebar">

        <div class="logo">
        <img id="imagem_logo"src="assets/image/logo_png_branca.png" alt="Logo Info Trem">
        </div>

    <ul>
        <li class="active">Início</li>
        <li>Sensores e Trens</li>
        <li>Monitoramento</li>
        <li>Relatórios</li>
        <li>Adicionar usuário</li>
        <li>Sair</li>
    </ul>
    </div>

 <div class="main-content">

        <div class="titulo-pagina">
            <img src="assets/image/imagem_usuario.png" alt="Usuário" id="imagemUsuario">

            <h2>Adicionar administrador/Usuário</h2>
        </div>

 
      <div class="formulario">

    <p>Dados do Administrador\Usuário</p>
    <p>Preencha as informações abaixo para cadastrar um novo usuário ou administrador</p>

       <div class="row mb-4">
           <div class="col-md-6">
                <label for="Nome">Nome Completo</label>
                <input type="text" id="nome completo" placeholder="Digite o nome completo" >
                <div id="erroNome" class="erro"></div>
            </div>

            <div class="col-md-6">
                <label for="E-mail">E-mail</label>
                <input type="text" id="E-mail" placeholder="Digite o e-mail" >
                <div id="erroe-email" class="erro"></div>
            </div>
            </div>
              
            <div class="row mb-4">
           <div class="col-md-6">
                <label for="Senha">Senha</label>
                <input type="text" id="senha" placeholder="Digite a senha" >
                <div id="erroSenha" class="erro"></div>
            </div>

            <div class="col-md-6">
                <label for="Confirmar senha">Senha</label>
                <input type="text" id="E-mail" placeholder="Digite a senha " >
                <div id="erroe-email" class="erro"></div>
            </div>
            </div>
   
           <div class="mb-4">
                <label>Status</label>
                <select class="form-select" id="campo">
                    <option value="">Escolha</option>
                    <option>Ativo</option>
                    <option>Inativo</option>
                </select>
            </div>


            <div class="d-flex justify-content-end gap-3">
                <button class="btn btn-light">
                    Cancelar
                </button>

                <button class="btn btn-danger">
                    Salvar
                </button>

            </div>
            </div>
            </div>

            
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
