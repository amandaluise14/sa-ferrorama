<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">   
    <title>Cadastro de Sensores</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
     <div class="d-flex align-items-start">
    <div class="sidebar">

        <div class="logo">
        <img id="imagem_logo"src="../assets/image/logo_png_branca.png" alt="Logo Info Trem">
        </div>

    <ul>
        <li class="active">Início</li>
        <li>Sensores e Trens</li>
        <li>Monitoramento</li>
        <li>Relatórios</li>
        <li>Adicionar usuário</li>
        <li>Sair</li>
    </ul>
    </div>
<div class="container mt-3">
 <div class="conteudo">

    <div class="d-flex align-items-start">
    <img src="../assets/image/imagem_usuario.png" alt="imagem usuário" id="imagemUsuario">
    <h2 id="titulo_adicionar">Cadastar Sensores</h2>
    </div>

      <div class="formulario">

       <div class="row mb-4">

    <div class="d-flex align-items-start">
       <div class="d-block p-2">

       <div class="row mb-3">

           <div class="col-md-12">
                <label for="Nome">Nome Sensor</label>
                <input type="text" id="nome_Sensor" placeholder="Sensor de velocidade do trem 77" >
                <div id="erroNome" class="erro"></div>
            </div>
            
          <div class="row mt-4">

          <div class="col-md-2" id="permissao_ativa">
          <label class="card-permissao ativo d-flex align-items-start gap-3">
          <input type="radio" name="perfil">
              <div>
          <h5>Trem</h5>
            </div>
        </label>
    </div>

    <div class="col-md-2" id="permissao_inativa">
        <label class="card-permissao d-flex align-items-start gap-3">
            <input type="radio" name="perfil">

            <div>
                <h5>Rota</h5>
            </div>
        </label>
    </div>
    </div>


            <div class="col-md-12">
                <label for="Descrever Localizção">Descrever Localizção</label>
                <input type="text" id="Descrever Localizção" placeholder="Velocidade do sensor localizado na rota" >
                <div id="erroe-Localização" class="erro"></div>
            </div>
            </div>
              
            <div class="row mb-12">
           <div class="col-md-12">
                <label for="Tipo de dado monitorado">Tipo de dado monitorado</label>
                <input type="text" id="senha" placeholder="Velocidade" >
                <div id="erroSenha" class="erro"></div>
            </div>

</div>
</div>
</div>
</div>
            
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
